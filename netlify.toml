# Hinweis zu connect-src und Google Sheets: Die CSV-URL auf docs.google.com
# antwortet mit einer Weiterleitung auf einen wechselnden Host der Form
# doc-XX-XX-sheets.googleusercontent.com. Fehlt dieser in connect-src, blockiert
# der Browser die Weiterleitung und die Bereiche "Angebote der Woche" und
# "Frische Neuzugaenge" bleiben leer. Das faellt lokal NICHT auf, weil der
# einfache Test-Server keine CSP-Header sendet - erst auf echtem Hosting.
# Deshalb der Platzhalter *.googleusercontent.com.

# Veroeffentlicht wird nicht das Repository selbst, sondern der Ordner "dist",
# den scripts/build-site.mjs aus einer ausdruecklichen Positivliste zusammen-
# stellt. Sonst waeren docs/, scripts/, cms/, TODO.md und vor allem
# original-site/ (Kopie der alten Website) oeffentlich abrufbar - und die
# unbearbeiteten Original-Fotos wuerden das Deployment unnoetig aufblaehen
# (108 MB statt 41 MB). Details im Kopf von scripts/build-site.mjs.
[build]
  command = "npm run build-site"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://gc.zgo.at; style-src 'self' 'sha256-iJlYimdFloOh/FuvlbQsx4ZnNghdlsS5ShjA+MFoRuQ='; img-src 'self' data: https:; font-src 'self'; media-src 'self'; connect-src 'self' https://docs.google.com https://*.googleusercontent.com https://109b8eda.sibforms.com https://*.goatcounter.com; frame-src https://www.openstreetmap.org; form-action 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS/JS werden ueber den Dateinamen versioniert (bei Aenderungen bitte
# den Dateinamen anpassen, z.B. style.min.css?v=2) - bis dahin ein
# moderat langer, aber nicht "immutable" Cache.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
